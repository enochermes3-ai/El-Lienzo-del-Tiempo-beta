name: Construir APK
on:
  push:
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Localizar proyecto
        id: loc
        run: |
          f=$(find . -name capacitor.config.json -not -path "*/node_modules/*" -not -path "*/android/*" | head -n1)
          test -n "$f" || { echo "No se encontró capacitor.config.json"; exit 1; }
          echo "dir=$(dirname "$f")" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Instalar dependencias
        working-directory: ${{ steps.loc.outputs.dir }}
        run: npm install
      - name: Crear proyecto Android
        working-directory: ${{ steps.loc.outputs.dir }}
        run: |
          rm -rf android
          npx cap add android
          sed -i '0,/<activity/s//<activity android:screenOrientation="sensorLandscape"/' android/app/src/main/AndroidManifest.xml
          npx cap sync android
      - name: Compilar APK
        working-directory: ${{ steps.loc.outputs.dir }}/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: El-lienzo-del-tiempo-APK
          path: ${{ steps.loc.outputs.dir }}/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
